name: QF Pre-Cross Convergence Test

on:
  push:
    branches:
      - "research/hema-20260927"
    paths:
      - "research_notes/qf_precross_convergence_test.py"
      - "research_notes/QF_PRECROSS_CONVERGENCE_PREREG_20260928.md"
      - ".github/workflows/qf_precross.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precross:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements_api.txt
      - name: Install dependencies
        run: pip install -r requirements_api.txt
      - name: Run preregistered pre-cross test
        run: PYTHONPATH=. python research_notes/qf_precross_convergence_test.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qf-precross-results
          path: qf_precross/
          if-no-files-found: warn
