name: Position Sizing Test

on:
  push:
    branches:
      - "research/hema-20260927"
    paths:
      - "research_notes/position_sizing_test.py"
      - "research_notes/POSITION_SIZING_PREREG_20260928.md"
      - ".github/workflows/position_sizing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sizing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements_api.txt
      - name: Install dependencies
        run: pip install -r requirements_api.txt
      - name: Run preregistered sizing test
        run: PYTHONPATH=. python research_notes/position_sizing_test.py
      - name: Upload sizing results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: position-sizing-results
          path: position_sizing/
          if-no-files-found: warn
