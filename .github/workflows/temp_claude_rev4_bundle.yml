name: Temporary Claude rev4 bundle
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble audit bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/research_notes bundle/canonical_baseline bundle/pinned_support_code
          cp research_notes/CLAUDE_REAUDIT_REQUEST_REV4_20260928.md bundle/research_notes/
          cp research_notes/CANONICAL_RECONSTRUCTION_FROZEN_RULES_20260928_REV4.md bundle/research_notes/
          for f in ENGINE.md LONEWOLF_RERUN.md PIT_FEATURES.md PORTFOLIO.md REBASELINE.md UNIVERSE.md; do
            cp "canonical_baseline/$f" "bundle/canonical_baseline/$f"
          done
          git show 48579180d21fda07339fa9305d30828bffef0bc3:masterscanner_api.py > bundle/pinned_support_code/masterscanner_api.py
          git show 48579180d21fda07339fa9305d30828bffef0bc3:scanner_rules.py > bundle/pinned_support_code/scanner_rules.py
          {
            echo "Claude Rev4 Independent Re-audit Source Bundle"
            echo "bundle_commit=08eb0a2144f800c2703f5ef8d7cb628d0430438f"
            echo "support_code_commit=48579180d21fda07339fa9305d30828bffef0bc3"
            echo "masterscanner_api_blob=6d8d6670fe89e7bc1c901816a18e7fff2a90dc00"
            echo "scanner_rules_blob=08dbcc519efc97425778cad83dc01fa07e7cb7f8"
            echo "chatgpt_final_reaudit_issue_comment=5877665120"
            echo "build_authorized=false"
            echo
            sha256sum bundle/research_notes/* bundle/canonical_baseline/* bundle/pinned_support_code/*
          } > bundle/MANIFEST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CLAUDE_QF_CANONICAL_AUDIT_REV4_SOURCE_BUNDLE
          path: bundle/
          if-no-files-found: error
