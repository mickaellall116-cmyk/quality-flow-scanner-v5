name: Trend Probe Tournament

on:
  push:
    branches:
      - "research/hema-20260927"
    paths:
      - "research_notes/trend_probe_tournament.py"
      - "research_notes/TREND_PROBE_TOURNAMENT_PREREG_20260928.md"
      - ".github/workflows/trend_probe_tournament.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trend-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements_api.txt
      - name: Install dependencies
        run: pip install -r requirements_api.txt
      - name: Run preregistered trend-probe tournament
        run: PYTHONPATH=. python research_notes/trend_probe_tournament.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trend-probe-tournament-results
          path: trend_probe_tournament/
          if-no-files-found: warn
