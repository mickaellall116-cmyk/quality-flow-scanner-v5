name: KAMA QF Filter Portfolio

on:
  push:
    branches:
      - "research/hema-20260927"
    paths:
      - "research_notes/kama_qf_filter_portfolio.py"
      - "research_notes/KAMA_QF_FILTER_PREREG_20260928.md"
      - ".github/workflows/kama_qf_filter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kama-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements_api.txt
      - name: Install dependencies
        run: pip install -r requirements_api.txt
      - name: Run preregistered KAMA portfolio screen
        run: PYTHONPATH=. python research_notes/kama_qf_filter_portfolio.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kama-qf-filter-results
          path: kama_qf_filter/
          if-no-files-found: warn
