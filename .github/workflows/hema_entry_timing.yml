name: HEMA Entry Timing Test

on:
  push:
    branches:
      - "research/hema-20260927"
    paths:
      - "research_notes/hema_entry_timing_test.py"
      - "research_notes/HEMA_ENTRY_TIMING_PREREG_20260928.md"
      - ".github/workflows/hema_entry_timing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entry-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements_api.txt
      - name: Install dependencies
        run: pip install -r requirements_api.txt
      - name: Run preregistered entry-timing test
        run: PYTHONPATH=. python research_notes/hema_entry_timing_test.py
      - name: Upload timing results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hema-entry-timing-results
          path: hema_entry_timing/
          if-no-files-found: warn
