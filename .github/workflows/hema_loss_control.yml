name: HEMA Loss Control Test

on:
  push:
    branches:
      - "research/hema-20260927"
    paths:
      - "research_notes/hema_protective_exit_test.py"
      - "research_notes/HEMA_PROTECTIVE_EXIT_PREREG_20260928.md"
      - ".github/workflows/hema_loss_control.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loss-control:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements_api.txt
      - name: Install dependencies
        run: pip install -r requirements_api.txt
      - name: Run loss-control test
        run: PYTHONPATH=. python research_notes/hema_protective_exit_test.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hema-loss-control-results
          path: hema_protective_exit/
          if-no-files-found: warn
