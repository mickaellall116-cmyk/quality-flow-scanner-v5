name: HEMA Research

on:
  push:
    branches:
      - "research/hema-20260927"
    paths:
      - "research_notes/hema_research.py"
      - ".github/workflows/hema_research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hema-research:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements_api.txt

      - name: Install dependencies
        run: pip install -r requirements_api.txt

      - name: Run HEMA research
        run: python research_notes/hema_research.py --output-dir hema_results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hema-research-results
          path: hema_results/
          if-no-files-found: warn
