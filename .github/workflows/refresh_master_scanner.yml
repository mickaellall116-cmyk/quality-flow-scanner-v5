name: Refresh MasterScanner Results

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "masterscanner_api.py"
      - "scanner_rules.py"
      - "scanner_streamlit_v5_mode_aware.py"
      - "scanner_streamlit_v5_1_morning_action.py"
      - "tests/**"
      - "requirements.txt"
      - "requirements_api.txt"
      - ".github/workflows/refresh_master_scanner.yml"
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: refresh-master-scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements_api.txt

      - name: Install scanner dependencies
        run: pip install -r requirements_api.txt

      - name: Test shared scanner rules
        run: |
          python -m compileall -q masterscanner_api.py scanner_rules.py scanner_streamlit_v5_mode_aware.py scanner_streamlit_v5_1_morning_action.py
          # Run only API/row-completion tests in this refresh job. Broader
          # research tests need independent dependencies and fixtures.
          python -m unittest discover -s tests -p "test_scanner_rules.py"
          python -m unittest discover -s tests -p "test_api_contract.py"

      - name: Generate and validate MasterScanner results
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          from masterscanner_api import buy_now, validate_candidate_rows
          from scanner_rules import filter_buy_now

          payload = buy_now(interval="4h", period="180d", limit=20)

          required = {"scanner", "generated_at", "interval", "count", "results"}
          missing = required - payload.keys()
          if missing:
              raise SystemExit(f"Invalid MasterScanner output; missing: {sorted(missing)}")
          if payload["interval"] != "4h":
              raise SystemExit(f"Unexpected interval: {payload['interval']}")
          if payload["count"] != len(payload["results"]):
              raise SystemExit("Result count does not match results array")

          previous = {}
          try:
              with open("latest_buy_now.json", "r", encoding="utf-8") as handle:
                  previous = json.load(handle)
          except (FileNotFoundError, json.JSONDecodeError):
              pass

          # Freeze the primary 4h candidate set until the market anchor advances.
          # Only the separate 15m/market validation may change between 4h closes.
          same_primary_bar = (
              payload.get("signal_id")
              and payload.get("signal_id") == previous.get("signal_id")
              and isinstance(previous.get("candidates"), list)
          )
          if same_primary_bar:
              payload["candidates"] = validate_candidate_rows(
                  previous["candidates"], payload["market_regime"]
              )

          payload["candidate_count"] = len(payload.get("candidates", []))
          payload["results"] = filter_buy_now(payload.get("candidates", []), limit=20)
          payload["count"] = len(payload["results"])
          payload["generated_at"] = datetime.now(timezone.utc).isoformat()
          payload["source"] = "github-actions"
          payload["uses_closed_4h_candles"] = True
          payload["primary_candidates_frozen"] = bool(same_primary_bar)

          with open("latest_buy_now.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          PY

      - name: Commit latest results
        run: |
          set -euo pipefail
          git config user.name "MasterScanner Bot"
          git config user.email "actions@github.com"
          cp latest_buy_now.json "$RUNNER_TEMP/masterscanner-result.json"
          # Two runners can start from the same checkout and both generate a result.
          # Rebase causes a JSON conflict. Instead, start every publish attempt
          # from the newest remote main and never overwrite a newer generation.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if ! python - "$RUNNER_TEMP/masterscanner-result.json" latest_buy_now.json <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          def timestamp(path):
              try:
                  with open(path, encoding="utf-8") as fh:
                      value = json.load(fh).get("generated_at")
                  if not value:
                      return datetime.min.replace(tzinfo=timezone.utc)
                  return datetime.fromisoformat(value.replace("Z", "+00:00")).astimezone(timezone.utc)
              except (FileNotFoundError, json.JSONDecodeError, ValueError, TypeError):
                  return datetime.min.replace(tzinfo=timezone.utc)
          candidate, published = sys.argv[1:]
          if timestamp(published) >= timestamp(candidate):
              print("No publish: remote result is at least as fresh.")
              sys.exit(1)
          PY
            then
              exit 0
            fi
            cp "$RUNNER_TEMP/masterscanner-result.json" latest_buy_now.json
            git add latest_buy_now.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Update MasterScanner results"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Publish race on attempt $attempt; retrying against current main."
          done
          echo "Could not publish after five attempts." >&2
          exit 1
