name: Refresh MasterScanner Results

on:
workflow_dispatch:
schedule:
- cron: "*/15 * * * *"

permissions:
contents: write

jobs:
refresh:
runs-on: ubuntu-latest

steps:
- name: Checkout repository
uses: actions/checkout@v4

- name: Pull latest MasterScanner results
run: |
curl -L --fail "https://masterscanner.mickaellall116.workers.dev/buy-now" -o latest_buy_now.json

- name: Commit latest results
run: |
git config user.name "MasterScanner Bot"
git config user.email "actions@github.com"
git add latest_buy_now.json
git diff --cached --quiet || git commit -m "Update MasterScanner results"
git push


