name: Refresh MasterScanner Results

on:
  workflow_dispatch:
  push:
    paths:
      - "masterscanner_api.py"
      - "scanner_rules.py"
      - "scanner_streamlit_v5_mode_aware.py"
      - "scanner_streamlit_v5_1_morning_action.py"
      - "tests/**"
      - "requirements.txt"
      - "requirements_api.txt"
      - ".github/workflows/refresh_master_scanner.yml"
  schedule:
    # Frequent market-hours refresh. GitHub scheduled jobs can be delayed,
    # so a 5-minute cadence gives the alert feed several chances to refresh.
    # 13:00-21:59 UTC covers the U.S. trading session across EDT/EST with buffer.
    - cron: "*/5 13-21 * * 1-5"

concurrency:
  group: refresh-master-scanner
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements_api.txt

      - name: Install scanner dependencies
        run: pip install -r requirements_api.txt

      - name: Test shared scanner rules
        run: |
          python -m compileall -q masterscanner_api.py scanner_rules.py scanner_streamlit_v5_mode_aware.py scanner_streamlit_v5_1_morning_action.py
          python -m unittest discover -s tests -p "test_*.py"

      - name: Generate and validate MasterScanner results
        run: |
          python - <<'PY'
          import json
          import time
          from datetime import datetime, timezone

          from masterscanner_api import buy_now
          from scanner_rules import filter_buy_now

          # yfinance can intermittently return incomplete data. Run several
          # attempts and keep the freshest attempt with the largest valid set.
          attempts = []
          for attempt in range(3):
              payload = buy_now(interval="4h", period="180d", limit=20)
              payload["results"] = filter_buy_now(payload.get("results", []), limit=20)
              payload["count"] = len(payload["results"])
              attempts.append(payload)
              if attempt < 2:
                  time.sleep(8)

          payload = max(attempts, key=lambda p: p.get("count", 0))

          required = {"scanner", "generated_at", "interval", "count", "results"}
          missing = required - payload.keys()
          if missing:
              raise SystemExit(f"Invalid MasterScanner output; missing: {sorted(missing)}")
          if payload["interval"] != "4h":
              raise SystemExit(f"Unexpected interval: {payload['interval']}")
          if payload["count"] != len(payload["results"]):
              raise SystemExit("Result count does not match results array")

          payload["generated_at"] = datetime.now(timezone.utc).isoformat()
          payload["source"] = "github-actions"
          payload["uses_closed_4h_candles"] = True
          payload["scan_attempts"] = len(attempts)

          with open("latest_buy_now.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          PY

      - name: Commit latest results
        run: |
          git config user.name "MasterScanner Bot"
          git config user.email "actions@github.com"

          cp latest_buy_now.json /tmp/latest_buy_now.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/latest_buy_now.json latest_buy_now.json

          git add latest_buy_now.json
          git diff --cached --quiet && exit 0
          git commit -m "Update MasterScanner results"
          git push origin HEAD:main
